document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.log[day()].splice(b.dataset.d,1);sv();r1()})}
function pv(){const G=tg();return`<b style="font-size:28px">${G.k}</b> ${t("kc")}<br>${t("p")} <b>${G.p}</b>${t("g")} · ${t("c")} <b>${G.c}</b>${t("g")} · ${t("f")} <b>${G.f}</b>${t("g")}<div class=mut style="font-weight:400;margin-top:6px">${t("bmr")}: ${G.td}${G.eta?` · ${t("eta")} ${G.eta} ${t("wks")}`:""}</div>`}
function r2(){const r=S.pr,o=S.ov[S.goal]||{},g=S.goal,G=tg(),N=(id,l,v,ph)=>`<div><label>${l}</label><input id=${id} type=number step=any inputmode=decimal value="${v??""}" placeholder="${ph||""}"></div>`,B=(d,k,l,on)=>`<button class="btn${on?"":" s"}" data-${d}=${k} style="flex:1;padding:12px 6px">${l}</button>`;
$("#v2").innerHTML=`<div class=card><label>${t("goal")}</label><div class=row>${["cut","bulk","recomp"].map(x=>B("g",x,t(x),x==g)).join("")}</div>
<label>${t("sex")}</label><div class=row>${B("s","m",t("m"),r.sex=="m")}${B("s","f",t("fm"),r.sex=="f")}</div>
<div class=g2 style="grid-template-columns:1fr 1fr 1fr">${N("a",t("a"),r.a)}${N("h",t("h"),r.h)}${N("w",t("w"),r.w)}</div></div>
<div class=card><div class=mut>${t("tg")}</div><div id=pv>${pv()}</div></div>
<details class=card><summary><b>${t("opt")}</b></summary>
<label>${t("act")}</label><select id=ac>${[[1.2,"a1"],[1.375,"a2"],[1.55,"a3"],[1.725,"a4"],[1.9,"a5"]].map(a=>`<option value=${a[0]} ${a[0]==r.act?"selected":""}>${t(a[1])}</option>`).join("")}</select>
${g=="recomp"?"":`<label>${t("pace")}: <b id=pl>${G.pc}</b> ${t("pwk")} <span class=mut>(${t("phint")})</span></label><input id=pc type=range min=0.1 max=${g=="cut"?1:0.5} step=0.05 value=${G.pc}>${N("tw",t("tw"),r.tw)}`}
<div class=g2>${N("ok",t("akc"),o.k)}${N("op",t("apk"),o.p,({cut:2,bulk:1.8,recomp:2})[g])}${N("of",t("afp"),o.f,25)}</div><button class="btn s" id=rs style="margin-top:10px;width:100%">${t("rst")}</button></details>
<button class=btn id=sa style="width:100%">${t("go2")}</button><div class=row style="margin-top:12px"><button class="btn s" id=ex style="flex:1">${t("exp")}</button><button class="btn s" id=im style="flex:1">${t("imp")}</button></div>`;
const up=()=>{const n=id=>+$("#"+id).value,V=id=>$("#"+id)?$("#"+id).value:"";S.pr={w:n("w"),h:n("h"),a:n("a"),tw:V("tw"),sex:S.pr.sex,act:n("ac")};if($("#pc")&&document.activeElement==$("#pc")){S.rate[g]=n("pc");$("#pl").textContent=S.rate[g]}
S.ov[g]={k:V("ok"),p:V("op"),f:V("of")};sv();$("#pv").innerHTML=pv()};
document.querySelectorAll("#v2 input,#v2 select").forEach(e=>e.oninput=up);
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.goal=b.dataset.g;sv();r2()});document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.pr.sex=b.dataset.s;sv();r2()});
$("#rs").onclick=()=>{S.ov[g]={};delete S.rate[g];sv();r2()};$("#sa").onclick=()=>{S.done=1;sv();tab=1;ui()};
$("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download="cali-backup.json";a.click()};
$("#im").onclick=()=>{const i=document.createElement("input");i.type="file";i.onchange=async()=>{try{S=Object.assign({},D,JSON.parse(await i.files[0].text()));sv();ui()}catch(e){}};i.click()}}
let tab=1;function ui(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=="he"?"rtl":"ltr";document.documentElement.dataset.t=S.theme;$("#ll").textContent=S.lang=="he"?"EN":"עב";$("#n1").textContent=t("today");$("#n2").textContent=t("set");$("#n1").className="btn"+(tab==1?"":" s");$("#n2").className="btn"+(tab==2?"":" s");$("#v1").hidden=tab!=1;$("#v2").hidden=tab!=2;r1();r2()}
$("#n1").onclick=()=>{tab=1;ui()};$("#n2").onclick=()=>{tab=2;ui()};$("#ll").onclick=()=>{S.lang=S.lang=="he"?"en":"he";sv();ui()};$("#tl").onclick=()=>{S.theme=S.theme=="dark"?"light":"dark";sv();ui()};
if(!localStorage.cali&&matchMedia("(prefers-color-scheme:dark)").matches)S.theme="dark";ui();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
